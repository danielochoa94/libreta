table:
  title: Reconciliation of income (loss) from operations to Segment Adjusted EBITDA

source:
  url: https://www.sec.gov/Archives/edgar/data/1181412/000162828026040364/spaceexplorationtechnologib.htm#id286866c4c474ba490d6531a57db9e93_1538
  image: segment-adjusted-ebitda-2025.png
  details:
    Table: Reconciliation of income (loss) from operations to Segment Adjusted EBITDA, year ended December 31, 2025
    Page: "120"
    Document: SpaceX 2026 S-1/A
    Extracted: 2026-08-08
  note: >
    Non-GAAP, defined by the company in Management's Discussion and Analysis rather than by the
    accounting standards. Only the reconciliation's result is stored: its add-back rows repeat
    depreciation and amortization, share-based compensation, restructuring, and impairment from
    Note 19, and checks.yaml rebuilds this figure from those. The filing also reconciles the three
    months ended March 31 of 2025 and 2026, which are interim and not part of this table.

