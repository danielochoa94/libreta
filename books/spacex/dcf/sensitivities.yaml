sensitivities:
  value_per_share:
    title: Value per share by cost of capital and perpetual growth
    output:
      line: dcf.value_per_share
      column: Value
      label: Value per share
    inputs:
      - line: dcf.terminal_value.perpetual_growth_rate
        column: Value
        label: Perpetual growth rate
        values: [0.025, 0.03, 0.035, 0.04]
      - line: dcf.wacc.wacc
        column: Value
        label: WACC
        values: [0.075, 0.08, 0.085, 0.09, 0.095, 0.10, 0.105]
    valid: dcf.terminal_value.perpetual_growth_rate["Value"] < dcf.wacc.wacc["Value"]

  ai_value_per_share:
    title: Value per share by how long AI growth lasts and its margin
    output:
      line: dcf.value_per_share
      column: Value
      label: Value per share
    inputs:
      - line: dcf.assumptions.adjusted_ebitda_margin_long_run
        column: AI
        label: AI long-run margin
        values: [0.35, 0.45, 0.55, 0.65]
      - line: dcf.assumptions.revenue_growth_fade
        column: AI
        label: AI growth fade
        values: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75]