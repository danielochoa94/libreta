name: Examples

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Export every book
        run: |
          for book in books/*/; do
            name="$(basename "$book")"
            mkdir -p "_site/$name"
            dotnet run --project src/Libreta -- "$book" --export "_site/$name/index.html"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - uses: actions/deploy-pages@v5
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}